name: Günlük analiz ve site yayını

# Runs on GitHub's servers with the free OpenRouter quota. The key comes from
# the repository secret OPENROUTER_API_KEY and never appears in the code.
on:
  schedule:
    - cron: '23 2 * * *'
    # Weekdays after the Istanbul close (19:40): prices, scorecard and site only.
    - cron: '40 16 * * 1-5'
    # Saturdays: five-year weekly price history.
    - cron: '7 5 * * 6'
    # Weekdays around noon Istanbul: brokers' morning reports (runs start 45-60 min late).
    - cron: '37 8 * * 1-5'
    # Every 15 minutes during the Istanbul session (10:00-18:45): delayed prices only.
    - cron: '*/15 7-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyses
  cancel-in-progress: false

jobs:
  analyses:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fiyatları yenile
        if: github.event.schedule != '*/15 7-15 * * 1-5'
        continue-on-error: true
        run: python research/prices.py && python research/scorecard.py
      - name: Smart Money okumasını yenile
        if: github.event.schedule == '40 16 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python research/smc.py
      - name: Fiyat geçmişini yenile
        if: github.event.schedule == '7 5 * * 6' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python research/price-history.py
      - name: Analizleri üret
        if: github.event.schedule == '23 2 * * *' || github.event_name == 'workflow_dispatch'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY tanımlı değil; yeni analiz üretilmedi."
          else
            python research/ai-analyses.py --limit 48
          fi
      - name: Tasfiyedeki fonların hisselerini al
        if: github.event.schedule != '*/15 7-15 * * 1-5'
        continue-on-error: true
        run: python research/fund-holdings.py
      - name: Yönetici ve hakim ortak işlemlerini topla
        if: github.event.schedule != '*/15 7-15 * * 1-5'
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null || true
          python research/insider-trades.py --days 7
      - name: Fondan borsa dışı alımları topla
        if: github.event.schedule != '*/15 7-15 * * 1-5'
        continue-on-error: true
        run: python research/insiders.py --days 7
      - name: Şirket olaylarını ve borsa tedbirlerini topla
        if: github.event.schedule != '*/15 7-15 * * 1-5'
        continue-on-error: true
        run: python research/market-events.py --days 7
      - name: SPK bültenlerini oku
        if: github.event.schedule == '7 5 * * 6' || github.event.schedule == '23 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null || true
          python research/spk-bulletins.py
      - name: Aracı kurum raporlarını topla
        if: github.event.schedule != '7 5 * * 6'
        continue-on-error: true
        run: |
          # Live-price runs collect broker reports only once, in the 12:00 Istanbul hour,
          # in case GitHub dropped the queued noon run in favour of a newer one.
          if [ "${{ github.event.schedule }}" = '*/15 7-15 * * 1-5' ] && [ "$(date -u +%H)" != '09' ]; then exit 0; fi
          sudo apt-get install -y -qq poppler-utils >/dev/null || true
          pip install -q yfinance || true
          python research/broker-reports.py --notes
          python research/broker-calls.py
          python research/foreks-reports.py
      - name: Geri alım bildirimlerini topla
        continue-on-error: true
        run: python research/buybacks.py --days ${{ github.event.schedule == '*/15 7-15 * * 1-5' && 7 || 35 }}
      - name: Günlük özeti yaz
        if: github.event.schedule == '40 16 * * 1-5' || github.event.schedule == '23 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python research/daily-summary.py
      - name: Gecikmeli fiyatları al
        continue-on-error: true
        run: python research/live.py
      - name: Değişiklikleri kaydet
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-analyses.json data/market-latest.json data/scorecard.json data/price-history.json data/price-history-gaps.json data/smc-summary.json data/benchmarks.json data/buybacks.json data/fund-transfers.json data/fund-holdings.json data/insider-trades.json data/daily-summary.json data/market-events.json data/spk-actions.json data/broker-reports.json data/broker-calls.json data/foreks-reports.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update market data"
            git push origin HEAD:main
          fi
      - name: Siteyi yayınla
        run: bash research/publish-site.sh
